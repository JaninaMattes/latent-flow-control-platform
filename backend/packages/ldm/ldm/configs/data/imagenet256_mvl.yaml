name: ImageNet_256
num_classes: 1000
target: ldm.dataloader.hdf5_dataset.dataloader.WebDataModuleFromConfig
params:
  tar_base: /export/group/datasets/ILSVRC/wds_shards
  batch_size: 200
  num_workers: 8
  val_num_workers: 2
  multinode: True
  remove_keys:
    - pickle
    - json
  train:
    shards: 'ImageNetTrain-train-{000000..000284}.tar'
    image_key: jpeg
    rename:
      image: jpeg
      label: cls
    image_transforms:
      - target: torchvision.transforms.RandomHorizontalFlip
        params:
          p: 0.5
      - target: torchvision.transforms.Resize
        params:
          size: 256
          interpolation: 2
          antialias: True
      - target: torchvision.transforms.CenterCrop
        params:
          size: 256

  validation:
    shards: 'ImageNetValidation-validation-{000000..000012}.tar'
    image_key: jpeg
    rename:
      image: jpeg
      label: cls
    image_transforms:
      - target: torchvision.transforms.Resize
        params:
          size: 256
          interpolation: 2
          antialias: True
      - target: torchvision.transforms.CenterCrop
        params:
          size: 256