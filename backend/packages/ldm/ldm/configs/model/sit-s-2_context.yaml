name: SiT-S-2
# Flow Model (SiT)
target: ldm.frameworks.rectified_flow.fm.RectifiedFlowModel
params:
  schedule: linear
  sigma_min: 0.0
  net_cfg:
    target: ldm.models.transformer.dit_context.DiT
    params:
      in_channels: 4
      input_size: 32
      depth: 12
      hidden_size: 384
      patch_size: 2
      num_heads: 16
      num_classes: 1000                   # Defines class label embedding, default: -1, for none
      context_size: 1024
      cat_context: True
      compile: True
